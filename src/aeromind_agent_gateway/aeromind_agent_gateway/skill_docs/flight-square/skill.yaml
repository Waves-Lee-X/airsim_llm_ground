name: flight.square
label: 正方形轨迹
version: 2.0.0
risk_level: high
description: 必要时起飞，依次飞行四条边，可选择结束后降落。
example_task: 飞一个边长 10 米的正方形轨迹
workflow_name: "${side_length} 米正方形轨迹"
parameters:
  side_length: {type: number, minimum: 1, maximum: 50, required: true}
  altitude: {type: number, minimum: 1, maximum: 30, default: 10}
  takeoff_if_needed: {type: boolean, default: true}
  land_after: {type: boolean, default: false}
workflow:
  - id: takeoff
    label: "必要时起飞到 ${altitude} 米"
    action: takeoff
    args: {altitude: "${altitude}"}
    condition: if_not_airborne
    retries: 1
    include_if: takeoff_if_needed
  - id: edge-1
    label: "正方形第一条边：前进 ${side_length} 米"
    action: move
    args: {direction: forward, distance: "${side_length}"}
  - id: edge-2
    label: "正方形第二条边：右移 ${side_length} 米"
    action: move
    args: {direction: right, distance: "${side_length}"}
    depends_on: [edge-1]
  - id: edge-3
    label: "正方形第三条边：后退 ${side_length} 米"
    action: move
    args: {direction: backward, distance: "${side_length}"}
    depends_on: [edge-2]
  - id: edge-4
    label: "正方形第四条边：左移 ${side_length} 米"
    action: move
    args: {direction: left, distance: "${side_length}"}
    depends_on: [edge-3]
  - id: land
    label: 正方形轨迹完成后降落
    action: land
    depends_on: [edge-4]
    condition: if_airborne
    include_if: land_after
