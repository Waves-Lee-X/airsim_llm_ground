name: flight.square
label: 正方形轨迹
version: 3.0.0
risk_level: high
description: 必要时起飞，通过 ROS 2 Action 和连续 Minimum Snap 轨迹飞行四条边，可选择结束后降落。
example_task: 飞一个边长 10 米的正方形轨迹
workflow_name: "${side_length} 米正方形轨迹"
parameters:
  side_length: {type: number, minimum: 1, maximum: 50, required: true}
  altitude: {type: number, minimum: 1, maximum: 30, default: 10}
  takeoff_if_needed: {type: boolean, default: true}
  land_after: {type: boolean, default: false}
workflow:
  - id: takeoff
    label: "必要时起飞到 ${altitude} 米"
    action: takeoff
    args: {altitude: "${altitude}"}
    condition: if_not_airborne
    retries: 1
    include_if: takeoff_if_needed
  - id: square-path
    label: 连续飞行正方形四条边
    action: follow_waypoints
    args:
      cruise_speed: 1.5
      points:
        - {forward_m: "${side_length}"}
        - {right_m: "${side_length}"}
        - {forward_m: "${-side_length}"}
        - {right_m: "${-side_length}"}
  - id: land
    label: 正方形轨迹完成后降落
    action: land
    depends_on: [square-path]
    condition: if_airborne
    include_if: land_after
