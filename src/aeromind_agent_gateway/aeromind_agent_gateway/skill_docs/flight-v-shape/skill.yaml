name: flight.v_shape
label: V 字轨迹
version: 2.0.0
risk_level: high
description: 组合两个相对向量航段形成 V 字轨迹，可在顶点拍照。
example_task: 飞一个宽 10 米、深 10 米的 V 字形并在顶点拍照
workflow_name: "宽 ${width} 米、深 ${depth} 米 V 字轨迹"
parameters:
  width: {type: number, minimum: 1, maximum: 50, default: 10}
  depth: {type: number, minimum: 1, maximum: 50, default: 10}
  altitude: {type: number, minimum: 1, maximum: 30, default: 10}
  takeoff_if_needed: {type: boolean, default: true}
  capture_at_vertex: {type: boolean, default: false}
  land_after: {type: boolean, default: false}
workflow:
  - id: takeoff
    label: "必要时起飞到 ${altitude} 米"
    action: takeoff
    args: {altitude: "${altitude}"}
    condition: if_not_airborne
    retries: 1
    include_if: takeoff_if_needed
  - id: left-leg
    label: 飞向 V 字顶点
    action: move
    args:
      forward_m: "${depth}"
      right_m: "${width / 2}"
  - id: vertex-capture
    label: 在 V 字顶点拍照
    action: capture_image
    depends_on: [left-leg]
    retries: 0
    include_if: capture_at_vertex
  - id: right-leg
    label: 从顶点飞向 V 字右端
    action: move
    args:
      forward_m: "${-depth}"
      right_m: "${width / 2}"
    depends_on: [left-leg]
  - id: land
    label: V 字轨迹完成后降落
    action: land
    depends_on: [right-leg]
    condition: if_airborne
    include_if: land_after
