[metadata]
name = aeromind-apm-lite
version = 0.1.0
description = Non-ROS digital-twin and ArduPilot execution stack for AeroMind
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10,<3.13
install_requires =
    pydantic>=2.6,<3
    PyYAML>=5.4,<7
    websockets>=12,<16

[options.packages.find]
where = src

[options.extras_require]
onboard =
    pymavlink>=2.4,<3
ground =
    fastapi>=0.115,<1
    uvicorn[standard]>=0.34,<1
dev =
    pytest>=7.4,<9
    pymavlink>=2.4,<3
    flake8>=4,<8

[options.entry_points]
console_scripts =
    aeromind-apm-m1-acceptance = aeromind_apm_lite.ground.simulation.m1_acceptance:main
    aeromind-apm-ground = aeromind_apm_lite.ground.browser.app:main
    aeromind-apm-probe = aeromind_apm_lite.onboard.probe:main
