schema_version: "1.0"
name: yice-parallel-domain-live-control
georeference: sitl-georeference.yaml
state_directory: ../../.runtime/parallel-domain-control
poll_interval_s: 0.25
observation_only: false
telemetry_stale_after_s: 3.0
recovery_samples: 2
reconnect_delay_s: 1.0
mavlink_silence_timeout_s: 5.0
telemetry_sample_interval_s: 0.1
lines:
  - line_id: px4
    adapter: px4
    vehicle_id: 1
    platform_type: px4_multirotor
    real:
      endpoint: udpin:0.0.0.0:14540
      simulator: gazebo
      dialect: common
      source_system: 250
      source_component: 190
      target_system: 1
      target_component: 1
      force_arm_for_sitl: true
    virtual:
      endpoint: udpin:0.0.0.0:14541
      simulator: airsim
      dialect: common
      source_system: 250
      source_component: 190
      target_system: 1
      target_component: 1
      force_arm_for_sitl: true
    policy:
      allowed_actions: [takeoff, waypoint, land]
      confirmation_required: true
      min_takeoff_altitude_m: 2.0
      max_altitude_m: 30.0
      max_distance_from_home_m: 100.0
      max_speed_m_s: 8.0
      min_gps_fix_type: 3
      max_telemetry_age_s: 2.0
      approval_ttl_s: 600
  - line_id: apm
    adapter: ardupilot
    vehicle_id: 2
    platform_type: ardupilot_multirotor
    real:
      endpoint: udpin:0.0.0.0:14550
      simulator: native-sitl
      dialect: ardupilotmega
      source_system: 250
      source_component: 190
      target_system: 2
      target_component: 1
      force_arm_for_sitl: true
    virtual:
      endpoint: udpin:0.0.0.0:14551
      simulator: airsim
      dialect: ardupilotmega
      source_system: 250
      source_component: 190
      target_system: 2
      target_component: 1
      force_arm_for_sitl: true
    policy:
      allowed_actions: [takeoff, waypoint, land]
      confirmation_required: true
      min_takeoff_altitude_m: 2.0
      max_altitude_m: 30.0
      max_distance_from_home_m: 100.0
      max_speed_m_s: 8.0
      min_gps_fix_type: 3
      max_telemetry_age_s: 2.0
      approval_ttl_s: 600
