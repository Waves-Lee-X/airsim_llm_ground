schema_version: "1.0"
mode: sim
fleet_name: aeromind-sitl-m1-single
vehicles:
  - vehicle_id: 1
    name: sitl-uav1
    runtime_host: ground-sim
    frame_calibration_id: venue-demo-v1
    credential_env: AEROMIND_UAV1_TOKEN
    sensor_source: airsim
    setpoint_rate_hz: 20.0
    trajectory_timeout_ms: 10000
    companion_heartbeat_hz: 1.0
    startup_timeout_s: 15.0
    heartbeat_timeout_s: 3.0
    ack_timeout_s: 3.0
    physical_timeout_s: 60.0
    telemetry_freshness_s: 1.0
    completion_hold_s: 0.5
    guided_mode: GUIDED
    hold_mode: LOITER
    fcu:
      transport: udp
      endpoint: udpin:0.0.0.0:14550
      source_system: 201
      source_component: 191
      target_system: 1
      target_component: 1
