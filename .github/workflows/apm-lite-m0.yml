name: AeroMind-APM Lite

on:
  push:
    paths:
      - "apm_lite/**"
      - ".github/workflows/apm-lite-m0.yml"
  pull_request:
    paths:
      - "apm_lite/**"
      - ".github/workflows/apm-lite-m0.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apm_lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python tools/export_schemas.py --check
      - run: python -m compileall -q src tools tests
      - run: python -m flake8 src tests tools --max-line-length=101 --extend-ignore=E203,W503
